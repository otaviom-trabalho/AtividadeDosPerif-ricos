<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Questionário de periféricos altamente necessário</h1>

        <form
        action="https://formspree.io/f/mrpzebwb"
        method="POST"
>

            <label>Qual é a marca do seu mouse?:</label>
            <input type = "text"
            placeholder="Digite a marca do seu mouse"/>

            <label>De que tipo é seu mouse?:</label>
            <input type = "text"
            placeholder="Ele é com fio ou sem fio?"/>

            <label>Qual é a marca do seu teclado?:</label>
            <input type = "text"
            placeholder="Digite a marca do seu teclado"/>

            <label>Seu teclado tem que tipo de switch?:</label>
            <input type = "text"
            placeholder="Magnético, mecânico ou de membrana?"/>

            <label>Você usa fone de ouvido ou caixa de som?:</label>
            <input type = "text"
            placeholder="Digite qual corresponde a sua posse atual">

            <label>Você usa microfone externo ou imbutido no fone??:</label>
            <input type = "text"
            placeholder="Digite qual corresponde a sua posse atual?"/>

            <button>Enviar</button>

        </form>

    </div>

</body>
</html>
